[env:uno]
platform = atmelavr
board = uno
framework = arduino

; Serial monitor settings
monitor_speed = 115200

; Libraries
lib_deps =
    adafruit/Adafruit Motor Shield library @ ^1.0.1

; Build flags
build_flags =
    -DBAUD_RATE=115200
    -DMAX_COMMAND_LENGTH=64

; Upload settings
upload_speed = 115200